server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: scholarpro-backend
    static_configs:
      - targets:
          - localhost
        labels:
          app: scholarpro
          component: backend
          env: staging
          job: scholarpro-backend
          __path__: /var/log/scholarpro/backend/*.log

  - job_name: scholarpro-frontend
    static_configs:
      - targets:
          - localhost
        labels:
          app: scholarpro
          component: frontend
          env: staging
          job: scholarpro-frontend
          __path__: /var/log/scholarpro/frontend/*.log
