name: ScholarPro CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: scholarpro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend test and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend lint
        working-directory: backend
        run: npx eslint .

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand --passWithNoTests

  frontend-quality:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build and publish container images
    needs:
      - backend-tests
      - frontend-quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker image tags must be lowercase, but the GitHub org/user name
      # (rangsey-Rv) has mixed case, so building the tag directly from
      # github.repository_owner fails with "repository name must be
      # lowercase". Compute a lowercased copy here instead.
      - name: Compute lowercase image owner
        id: image_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image_owner.outputs.owner }}/scholarpro-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ steps.image_owner.outputs.owner }}/scholarpro-${{ matrix.app }}:${{ github.ref_name }}

  deploy:
    name: Deploy to environment
    needs:
      - docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "Skipping deployment because DEPLOY_HOST and DEPLOY_USER are not configured."
            exit 0
          fi

          chmod +x scripts/deploy.sh

          scp -P "$DEPLOY_PORT" -o StrictHostKeyChecking=no scripts/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/deploy.sh"

          ssh -p "$DEPLOY_PORT" -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ENV='${APP_ENV}' IMAGE_TAG='${IMAGE_TAG}' GHCR_OWNER='${GHCR_OWNER}' GITHUB_ACTOR='${GITHUB_ACTOR}' GITHUB_TOKEN='${GITHUB_TOKEN}' bash /tmp/deploy.sh"